[project]
name = "devpost-mcp"
version = "0.1.0"
description = "Crawl Devpost hackathons, prizes, and projects into SQLite for the devpost MCP server"
readme = "README.md"
authors = [
    { name = "Anmol Hurkat", email = "238388601+sudoanmol@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "selectolax>=1.0.0",
]

[project.scripts]
devpost = "devpost_mcp.crawl:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
