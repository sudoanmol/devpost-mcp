[project]
name = "devpost-mcp"
version = "0.1.0"
description = "MCP server for live Devpost hackathon data, sponsor prize search, and idea scoring"
readme = "README.md"
authors = [
    { name = "Anmol Hurkat", email = "238388601+sudoanmol@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "selectolax>=1.0.0",
]

[project.scripts]
devpost-mcp = "devpost_mcp:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
